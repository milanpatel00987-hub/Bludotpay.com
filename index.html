<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bluedotpay - लॉगिन / रजिस्ट्रेशन</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-content: center; min-height: 100vh; padding: 20px; flex-direction: column; align-items: center; }
        .brand-logo { font-size: 32px; font-weight: bold; color: #38bdf8; margin-bottom: 20px; letter-spacing: 1px; }
        .auth-container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; font-size: 16px; }
        input:focus { border-color: #38bdf8; outline: none; }
        .btn { width: 100%; padding: 12px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #0ea5e9; }
        .toggle-text { text-align: center; margin-top: 15px; color: #94a3b8; font-size: 14px; cursor: pointer; }
        .toggle-text span { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="brand-logo">bluedotpay</div>

    <div class="auth-container" id="loginBox">
        <h2>कस्टमर लॉगिन</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>मोबाइल नंबर</label>
                <input type="tel" id="loginMobile" placeholder="अपना मोबाइल नंबर डालें" required maxlength="10">
            </div>
            <div class="form-group">
                <label>पासवर्ड</label>
                <input type="password" id="loginPassword" placeholder="पासवर्ड डालें" required>
            </div>
            <button type="submit" class="btn">लॉगिन करें</button>
            <p class="toggle-text" onclick="toggleAuth()">नया अकाउंट बनाएं? <span>यहाँ रजिस्टर करें</span></p>
        </form>
    </div>

    <div class="auth-container" id="registerBox" style="display: none;">
        <h2>नया रजिस्ट्रेशन</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>मोबाइल नंबर</label>
                <input type="tel" id="regMobile" placeholder="10 अंकों का मोबाइल नंबर" required maxlength="10">
            </div>
            <div class="form-group">
                <label>नया पासवर्ड बनाएं</label>
                <input type="password" id="regPassword" placeholder="एक मजबूत पासवर्ड बनाएं" required>
            </div>
            <button type="submit" class="btn">रजिस्टर करें</button>
            <p class="toggle-text" onclick="toggleAuth()">पहले से अकाउंट है? <span>लॉगिन करें</span></p>
        </form>
    </div>

    <script>
        function toggleAuth() {
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                registerBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                registerBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
